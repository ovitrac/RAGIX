# saqqara store — packaged defaults, the single source of truth for shape.
#
# A user file is a PARTIAL overlay: it names only what it changes, and every key
# it names must exist here. That is what makes an unknown key a typo rather than
# a feature nobody implemented — see config.py.
#
# Author: Olivier Vitrac, PhD, HDR | olivier.vitrac@adservio.fr | Adservio

source:
  path: ./docs
  formats: [pdf, docx, xlsx, pptx, md]
  promote_outline: false

store:
  provider: sqlite
  path: .ragix/saqqara.db
  corpus: default

# Refinement: the vector a refusal costs, restored by splitting the text (K7.22).
#
# One pass per budget, in order, each reading the result the last one left. A pass
# splits every text over its budget or refused into contiguous windows of the text's
# own children, embeds only the parts, and leaves the text represented by them.
#
# Empty by default, so a store is unchanged unless a run asks for a pass. The
# budgets are declared here and carried in the trace, never a bare constant.
refine:
  # Character budgets, one pass each, largest first. The lead's value for the first
  # pass is 4000 — the same number as the chunker's WINDOW_FALLBACK_CHARS, so one
  # figure governs both — and it answers the fidelity limit rather than the context
  # limit: the smallest refusal measured on a real corpus was 18 190 characters at
  # an 8192-token window, and one vector for a section that long says little about
  # any part of it.
  budgets: []
  # Overlap between consecutive windows, counted in CHILDREN, not characters — the
  # chunker's WINDOW_OVERLAP_CHARS is a different thing, for cutting one oversized
  # node. Zero by default: with overlap two windows carry the same child under two
  # ids, and rule 7 (no duplicate copy counts as independent corroboration) then
  # rests on the retriever collapsing them, which it does — but a default nobody
  # asked for should not lean on that.
  overlap_children: 0

embedder:
  # none | sentence-transformers | ollama | dummy
  # `none` is a choice, not an omission: it yields a lexical-only store and the
  # status line says so rather than leaving the caller to infer it.
  provider: none
  model: ""
  base_url: ""
  # A reference, never a value: env:VAR or file:/path#Label. Resolved at use and
  # never serialised, so a config object is always safe to log or POST.
  api_key_ref: ""
  # Texts per request. Measured on the executor over 300 chunks of a real corpus
  # (2026-09-05): one by one 4.3/s, 32 at a time 75.5/s, 128 at a time 93.7/s for
  # snowflake-arctic-embed2 — same vectors, 0.0 maximum absolute difference. The
  # shared EmbeddingConfig default is 32 and means a GPU batch for a local
  # library, which is a different quantity; this one is texts per HTTP request,
  # so the store states its own. `1` sends one text per request, deliberately.
  batch_size: 128

index:
  backend: numpy      # numpy | faiss
  use_gpu: false

chunker:
  unit_max_chars: 1200
  rollup_levels: 1
  window_fallback_chars: 4000

retrieval:
  fusion: rrf
  rrf_k: 60
  dense_k: 40
  lexical_k: 40
  top_k: 10
