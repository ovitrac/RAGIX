# saqqara store — packaged defaults, the single source of truth for shape.
#
# A user file is a PARTIAL overlay: it names only what it changes, and every key
# it names must exist here. That is what makes an unknown key a typo rather than
# a feature nobody implemented — see config.py.
#
# Author: Olivier Vitrac, PhD, HDR | olivier.vitrac@adservio.fr | Adservio

source:
  path: ./docs
  formats: [pdf, docx, xlsx, pptx, md]
  promote_outline: false

store:
  provider: sqlite
  path: .ragix/saqqara.db
  corpus: default

# ---------------------------------------------------------------------------
# PDF reading — opt-in choices (2026-09-14). Read by the reader, stage 1
# (`saqqara_run`, config section `pdf`); declared here because this file is the
# single source of truth for the shape of a configuration. Every default below
# reproduces, byte for byte, the trees and the store built before the keys
# existed: at the defaults the registered reader reads, not a copy of it.
pdf:
  # Which library reads a page's text: pypdf | pymupdf.
  # pypdf (BSD-3-Clause) is the default. pymupdf is AGPL-3.0, installed only by
  # the `saqqara-mupdf` extra, confined to adapters/pdf_mupdf.py and never
  # loaded unless chosen here (K6.16). A document it read says so in its
  # provenance: kernel_version `0.8.0+pymupdf-<version>`. Outline, pages,
  # pictures and ink are read by pypdf whichever reader is chosen.
  text_reader: pypdf
  # Join the fragments of one visual line into one text node. A joined node
  # keeps its raw fragments in `facts.fragments`; a join where a digit meets a
  # digit is marked `facts.review: {reason: digit-run-joined}` — a value to be
  # verified by a person, never a silent repair. Counts per page in
  # `facts.line_join`; provenance kernel_version `0.8.0+line-join`.
  line_join: false
# ---------------------------------------------------------------------------

# Refinement: the vector a refusal costs, restored by splitting the text (K7.22).
#
# One pass per budget, in order, each reading the result the last one left. A pass
# splits every text over its budget or refused into contiguous windows of the text's
# own children, embeds only the parts, and leaves the text represented by them.
#
# Empty by default, so a store is unchanged unless a run asks for a pass. The
# budgets are declared here and carried in the trace, never a bare constant.
refine:
  # Character budgets, one pass each, largest first. The lead's value for the first
  # pass is 4000 — the same number as the chunker's WINDOW_FALLBACK_CHARS, so one
  # figure governs both — and it answers the fidelity limit rather than the context
  # limit: the smallest refusal measured on a real corpus was 18 190 characters at
  # an 8192-token window, and one vector for a section that long says little about
  # any part of it.
  budgets: []
  # Overlap between consecutive windows, counted in CHILDREN, not characters — the
  # chunker's WINDOW_OVERLAP_CHARS is a different thing, for cutting one oversized
  # node. Zero by default: with overlap two windows carry the same child under two
  # ids, and rule 7 (no duplicate copy counts as independent corroboration) then
  # rests on the retriever collapsing them, which it does — but a default nobody
  # asked for should not lean on that.
  overlap_children: 0

embedder:
  # none | sentence-transformers | ollama | dummy
  # `none` is a choice, not an omission: it yields a lexical-only store and the
  # status line says so rather than leaving the caller to infer it.
  provider: none
  model: ""
  base_url: ""
  # A reference, never a value: env:VAR or file:/path#Label. Resolved at use and
  # never serialised, so a config object is always safe to log or POST.
  api_key_ref: ""
  # Texts per request. Measured on the executor over 300 chunks of a real corpus
  # (2026-09-05): one by one 4.3/s, 32 at a time 75.5/s, 128 at a time 93.7/s for
  # snowflake-arctic-embed2 — same vectors, 0.0 maximum absolute difference. The
  # shared EmbeddingConfig default is 32 and means a GPU batch for a local
  # library, which is a different quantity; this one is texts per HTTP request,
  # so the store states its own. `1` sends one text per request, deliberately.
  batch_size: 128

index:
  backend: numpy      # numpy | faiss
  use_gpu: false

chunker:
  unit_max_chars: 1200
  rollup_levels: 1
  window_fallback_chars: 4000

# ---- Store options (2026-09-14) ---------------------------------------------------
# Each key below switches ONE behaviour of the store on. Its default reproduces the
# store exactly as it was built before the key existed — the same rows, byte for
# byte — so a store is unchanged unless a run asks. Flipping a default is a decision
# taken after review, one line here; never a side effect of another change.
store_options:
  # Persist each table's cells into `objects.cells_json`, for the three readers that
  # read tables (xlsx, docx, pptx): one row per cell — node_id, row, col, merged,
  # text — in the grid vocabulary the header-band rules read, so a cell can be joined
  # to the header rows and label columns recorded beside it (K7.11). Off, the column
  # stays NULL and the grid lives only in the stored tree.
  table_cells: false
  # Assemble a roll-up without repeating the windows' overlap at each seam. A single
  # node longer than `chunker.window_fallback_chars` is cut into windows that overlap
  # by the chunker's WINDOW_OVERLAP_CHARS (200); joined as they are, a roll-up repeats
  # those characters at every seam. On, the windows of one node contribute its text
  # once, whole (K7.4); the level-0 windows are unchanged. Refused together with
  # `refine.budgets`, whose spans are measured on the join of the children.
  rollup_without_window_overlap: false

retrieval:
  fusion: rrf
  rrf_k: 60
  dense_k: 40
  lexical_k: 40
  top_k: 10
