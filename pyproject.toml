[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragix"
version = "0.74.0"
description = "RAGIX - Retrieval-Augmented Generative Interactive eXecution Agent"
authors = [
    {name = "Olivier Vitrac", email = "olivier.vitrac@adservio.fr"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.31.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp[cli]>=1.0,<2"]
dev = ["pytest>=7.0", "black", "ruff"]
web = ["fastapi>=0.104.0", "uvicorn>=0.24.0", "websockets>=12.0"]
retrieval = ["sentence-transformers>=2.2.0", "numpy>=1.24.0"]
vault = ["cryptography>=41.0.0"]
ci = ["pyyaml>=6.0"]
wasm = ["wasmtime>=14.0.0"]
ast = ["javalang>=0.13.0", "jsonschema>=4.17.0"]
reports = ["jinja2>=3.1.0", "weasyprint>=60.0"]
docs = ["python-docx>=1.0.0", "python-pptx>=0.6.21", "openpyxl>=3.1.0", "odfpy>=1.4.1"]
koas = ["ragix[ast]"]  # KOAS kernels require AST tools
# RAGIX-Sealed: confidential-document subsystem. Crypto (vault) + YAML (ci) + document
# text extraction. Kept optional and scoped to the sealed part only.
sealed = ["ragix[vault,ci]", "pypdf>=4.0.0", "pdfminer.six>=20221105", "python-docx>=1.0.0"]
# KOAS-Translate: EN→FR scientific translation kernels. pymupdf4llm handles the
# text-layer PDF→Markdown path; marker-pdf (heavy ML OCR, multi-GB weights) is an
# optional fallback for scanned/image-only PDFs — install separately if needed.
translate = ["pymupdf4llm>=0.0.17", "pymupdf>=1.24.0"]
# saqqara: document substrate kernels. Regroups packages already declared elsewhere
# (docs covers docx/pptx/xlsx, pypdf covers the pdf reader) rather than widening
# `docs` — a document tree needs the pdf reader, an odf converter does not.
# pypdfium2 is Apache-2.0 and rasterises a region of drawing so it can be stored
# and compared. It is the DEFAULT renderer precisely because its licence imposes
# nothing on a deployment of this MIT package.
saqqara = ["ragix[docs]", "pypdf>=4.0.0", "pypdfium2>=4.0.0", "numpy>=1.24.0"]
# saqqara-mupdf: an ALTERNATIVE renderer, opt-in and never installed by default.
#
#   LICENCE WARNING -- pymupdf is AGPL-3.0 (or a paid commercial licence).
#   Installing this extra subjects the deploying system to AGPL obligations that
#   are incompatible with distributing this package under MIT. It is never
#   required by any default path, by any test, or by the `all` extra, and the
#   kernel refuses to import it outside its single named adapter.
#
# Offered because a caller who already holds a commercial licence, or who is not
# distributing, may prefer its output. That choice is theirs to make explicitly.
saqqara-mupdf = ["pymupdf>=1.24.0"]
all = ["ragix[mcp,web,retrieval,vault,ci,wasm,ast,reports,koas,docs,sealed,translate,saqqara]"]

[project.scripts]
ragix = "ragix_core.cli:main"
ragix-unix-agent = "ragix_unix.cli:main"
ragix-web = "ragix_web.server:main"
ragix-index = "ragix_unix.index_cli:main"
ragix-batch = "ragix_unix.batch_cli:main"
ragix-vault = "ragix_unix.vault_cli:main"
ragix-wasp = "ragix_unix.wasp_cli:main"
ragix-ast = "ragix_unix.ast_cli:main"
ragix-koas = "ragix_kernels.orchestrator:main"
ragix-memory = "ragix_core.memory.cli:main"
ragix-translate = "ragix_kernels.translate.cli:main"

[project.urls]
Homepage = "https://github.com/ovitrac/RAGIX"
Repository = "https://github.com/ovitrac/RAGIX"

[tool.setuptools.packages.find]
where = ["."]
include = ["ragix_core*", "ragix_unix*", "ragix_web*", "ragix_audit*", "ragix_kernels*", "wasp_tools*"]
exclude = ["tests*", "MCP*"]

# Ship non-.py kernel resources inside built wheels (otherwise a non-editable
# `pip install` omits them and kernels that read them via Path(__file__).parent
# break at runtime). Covers translate/prompts/*.txt, docs/schemas/*.yaml,
# presenter/themes/*.{css,yaml}, glossaries, etc.
[tool.setuptools.package-data]
"*" = ["*.txt", "*.csv", "*.yaml", "*.yml", "*.css", "*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
