# Repository guard — refuses content that must not enter this public repository.
#
# The pre-commit hook in tools/ is local to one clone. It does not protect a
# second clone, a contributor, or anything arriving through a pull request, and
# it can be stepped over with --no-verify. This workflow is the half that cannot
# be, and it is a precondition of the first public push rather than a nicety.
#
# Author: Olivier Vitrac, PhD, HDR | olivier.vitrac@adservio.fr | Adservio | 2026-08-27

name: guard

on:
  push:
  pull_request:

jobs:
  forbidden-strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The guard scans what a change introduces as well as what is already
          # here, so it needs more than the tip commit.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove the guard fires
        # A guard nobody has seen fire says nothing about the files it passed.
        # This runs first: if the self-test fails, the scan below is worthless.
        run: python3 tools/check_forbidden.py --selftest

      - name: Scan every tracked file
        run: |
          git ls-files -z | xargs -0 python3 tools/check_forbidden.py

  # The scan above reads the tip tree, and the hook reads what is staged. Neither
  # sees a blob that existed only in an intermediate commit, and neither reads a
  # commit message at all. Removing a name in a later commit does not remove it
  # from what merging this branch would publish, so the range is scanned as well.
  # pull_request only: on a push there is no second ref to define a range against.
  forbidden-strings-history:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole range must be present, not just the tip commit.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove the guard fires
        run: python3 tools/check_forbidden.py --selftest

      - name: Scan every blob revision and every commit message in this pull request
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python3 tools/check_forbidden.py --history "origin/${{ github.base_ref }}..HEAD"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: python3 -m pip install --upgrade pip && python3 -m pip install -e ".[saqqara,mcp,dev]"

      - name: Gates
        run: python3 -m pytest tests/saqqara -q
